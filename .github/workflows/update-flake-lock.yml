name: update-flake-lock

on:
  schedule:
    # Monday, off the hour (GitHub delays or drops :00 runs). The PR and its CI,
    # about 2h for a new Spark kernel, are ready for Monday morning in US Central.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout only. The PAT below pushes and opens the PR.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          # A PAT, because a PR opened with GITHUB_TOKEN does not trigger CI.
          # Only this action needs it: its create-pull-request step sets its own
          # push credentials, so checkout keeps none.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN }}
          # Both must be Conventional Commits: a single-commit PR squashes under
          # the commit subject, otherwise under the PR title.
          commit-msg: "chore(flake): update flake.lock"
          pr-title: "chore(flake): update flake.lock"
          pr-body: |
            Weekly `flake.lock` update by `.github/workflows/update-flake-lock.yml`.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            - Hosts changed: see the `Find changed hosts` and `Build` jobs in CI.
            - Secret references added: none.
            - Rollback: revert the squash commit on `main`. The hosts follow it through comin.
            - Merge in the web UI, so GitHub signs the tip commit that comin deploys.
