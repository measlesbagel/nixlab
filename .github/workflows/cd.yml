name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: true

# Hosts deploy main themselves (modules/comin.nix); this only re-checks main
# after a merge. It holds no credential that reaches the lab.
jobs:
  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci
      - run: nix flake check --print-build-logs

  # A cache saved on main is readable from every PR; ci.yml's Find changed
  # hosts restores it under the same key.
  flake-inputs:
    name: Cache flake inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          key: flake-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock') }}
      # Fetches every input a host evaluation needs.
      - run: |
          nix eval --json .#nixosConfigurations \
            --apply 'builtins.mapAttrs (_: c: c.config.system.build.toplevel.drvPath)' > /dev/null
