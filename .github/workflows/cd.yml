name: cd

on:
  push:
    branches: [main]

permissions:
  contents: read

# Hosts deploy main themselves (modules/comin.nix); this only re-checks main
# after a merge. It holds no credential that reaches the lab.
jobs:
  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci
      - run: nix flake check --print-build-logs
