name: tailscale-policy

on:
  push:
    branches: [main]
    paths: [tailscale/**, .github/workflows/tailscale-policy.yml]
  pull_request:
    paths: [tailscale/**, .github/workflows/tailscale-policy.yml]

permissions:
  contents: read

concurrency:
  group: tailscale-policy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # PRs: run the policy's tests with a read-only identity. It is bound to
  # pull_request runs, so a PR cannot use it to change the tailnet.
  test:
    name: Test policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Tailscale workload identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          tailnet: ${{ vars.TS_TAILNET }}
          oauth-client-id: ${{ vars.TS_POLICY_READ_CLIENT_ID }}
          audience: ${{ vars.TS_POLICY_READ_AUDIENCE }}
          policy-file: tailscale/policy.hujson
          action: test

  # main: apply. The write identity is only issued to runs in the
  # `production` environment on main.
  apply:
    name: Apply policy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for Tailscale workload identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          tailnet: ${{ vars.TS_TAILNET }}
          oauth-client-id: ${{ vars.TS_POLICY_WRITE_CLIENT_ID }}
          audience: ${{ vars.TS_POLICY_WRITE_AUDIENCE }}
          policy-file: tailscale/policy.hujson
          action: apply
