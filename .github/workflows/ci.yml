name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required to scan pull requests
          GITLEAKS_LICENSE_KEY: "" # personal repo: no license needed
          GITLEAKS_ENABLE_COMMENTS: "false"

  zizmor:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          # Uploading SARIF needs security-events: write; fail in the log instead.
          advanced-security: false

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci
      - run: nix flake check --print-build-logs

  # The action only annotates unless fail-mode is set.
  flake-checker:
    name: Flake lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          fail-mode: true
          ignore-missing-flake-lock: false
          send-statistics: false

  changed:
    name: Find changed hosts
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.changed.outputs.builds }}
      attributes: ${{ steps.changed.outputs.attributes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          hosts=$(nix run .#changed-hosts -- "$BASE")
          echo "changed hosts: $hosts"
          # All aarch64 hosts build in one job. Today those are the two Sparks,
          # which share their whole NVIDIA kernel, so it compiles once.
          builds=$(jq -c '
            map(select(.system != "aarch64-linux") | {name: .host, system, hosts: .host, vmTests: (if .vmTest then .host else "" end)})
            + (map(select(.system == "aarch64-linux"))
               | if length > 0 then [{name: (map(.host) | join(", ")), system: "aarch64-linux", hosts: (map(.host) | join(" ")), vmTests: (map(select(.vmTest) | .host) | join(" "))}] else [] end)
          ' <<< "$hosts")
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
          # nix-diff-action reads its attributes input as YAML, which accepts JSON.
          # It evaluates each attribute on the base too, so added hosts are left out.
          attributes=$(jq -c 'map(select(.added | not) | {displayName: .host, attribute: "nixosConfigurations.\(.host).config.system.build.toplevel"})' <<< "$hosts")
          echo "attributes=$attributes" >> "$GITHUB_OUTPUT"

  # The only job with a write token, scoped to PR comments. Evaluation only:
  # it diffs the .drv files, so the Spark kernel is not built a second time.
  # Dependabot's pull_request token is read-only, so its PRs get no comment.
  diff:
    name: Closure diff
    needs: changed
    if: needs.changed.outputs.attributes != '[]' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # nix-diff-action posts the diff as a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # v1.1.1 finds its comment by the host name when one host changed and by a
      # shared marker otherwise, so a changed set of another size would post a
      # second comment. Re-key the existing one to the marker it will look for.
      - name: Re-key the existing comment
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTS: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
          ATTRIBUTES: ${{ needs.changed.outputs.attributes }}
        run: |
          set -euo pipefail
          marker=$(jq -r 'if length == 1 then "<!-- nix-diff-action:\(.[0].displayName) -->" else "<!-- nix-diff-action -->" end' <<< "$ATTRIBUTES")
          url=$(gh api --paginate "$COMMENTS" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- nix-diff-action"))) | .url' | sed -n 1p)
          if [ -n "$url" ]; then
            body=$(gh api "$url" --jq .body)
            gh api --method PATCH "$url" -f "body=$marker"$'\n'"${body#*$'\n'}" > /dev/null
          fi
      - uses: natsukium/nix-diff-action@4091452e4c7b3c7ea4ecbaec84be7f0066d810d7 # v1.1.1
        with:
          attributes: ${{ needs.changed.outputs.attributes }}
          comment-strategy: update

  # The Cachix token reaches only the Cachix action, and only on same-repo PRs.
  build:
    name: Build ${{ matrix.name }}
    needs: changed
    if: needs.changed.outputs.builds != '[]'
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # The NVIDIA kernel takes about 2h on the arm runner; a hung build stops here
    # instead of at GitHub's 6h limit.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed.outputs.builds) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Cachix pushes the whole closure of each path a build made, so a path
      # substituted from Flox or graham33 would go up with it: push only when
      # every host substitutes from cache.nixos.org and our cache alone. The
      # server drops what cache.nixos.org has while the cache's upstream
      # caches setting stays on.
      - name: Plan Cachix push
        id: cachix
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          read -ra hosts <<< "$HOSTS"
          push=true
          for host in "${hosts[@]}"; do
            cache=$(nix eval --json ".#nixosConfigurations.$host.config" --apply 'c: {
              inherit (c.homelab.cache) name;
              subs = c.nix.settings.substituters ++ (c.nix.settings.extra-substituters or [ ]);
            }')
            name=$(jq -r .name <<< "$cache")
            jq -e --arg own "https://$name.cachix.org" '
              ((.subs | map(rtrimstr("/")) | unique) - ["https://cache.nixos.org", $own]) == []
            ' <<< "$cache" > /dev/null || push=false
          done
          bin=$(nix build --inputs-from . 'nixpkgs#cachix^bin' --no-link --print-out-paths)/bin/cachix
          echo "cache $name, push $push"
          printf '%s\n' "name=$name" "push=$push" "bin=$bin" >> "$GITHUB_OUTPUT"
      # Starts before the build so Nix's post-build hook sees every build; the
      # push is the action's post step. Fork and Dependabot PRs have an empty
      # token, which leaves it nothing to push and does not fail it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ steps.cachix.outputs.name }}
          cachixBin: ${{ steps.cachix.outputs.bin }}
          authToken: ${{ steps.cachix.outputs.push == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ steps.cachix.outputs.push != 'true' }}
          skipAddingSubstituter: true # the hosts' own config adds it
      # Substitutes from the caches each host trusts, ours included
      # (modules/cache.nix). The installer trusts the runner user, which
      # --option needs.
      # --keep-going: one grouped host failing must not hide whether the others build.
      - name: Build closure
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          read -ra hosts <<< "$HOSTS"
          subs=() keys=()
          for host in "${hosts[@]}"; do
            caches=$(nix eval --json ".#nixosConfigurations.$host.config" --apply 'c: {
              subs = c.nix.settings.extra-substituters or [ ];
              keys = c.nix.settings.extra-trusted-public-keys or [ ];
            }')
            mapfile -t -O "${#subs[@]}" subs < <(jq -r '.subs[]' <<< "$caches")
            mapfile -t -O "${#keys[@]}" keys < <(jq -r '.keys[]' <<< "$caches")
          done
          opts=()
          if ((${#subs[@]})); then
            opts=(--option extra-substituters "$(printf '%s\n' "${subs[@]}" | sort -u | paste -sd ' ')"
              --option extra-trusted-public-keys "$(printf '%s\n' "${keys[@]}" | sort -u | paste -sd ' ')"
              --option connect-timeout 5)
          fi
          targets=()
          for host in "${hosts[@]}"; do
            targets+=(".#nixosConfigurations.$host.config.system.build.toplevel")
          done
          nix build "${targets[@]}" --no-link --keep-going --print-build-logs "${opts[@]}"
      # Installs each host from its disko layout and boots it under KVM, which
      # nix-installer-action enables; the closure above is already local.
      # The empty post-build hook keeps the test's disk images and VM systems
      # out of the Cachix push.
      - name: Boot test
        if: matrix.vmTests != ''
        timeout-minutes: 30
        env:
          HOSTS: ${{ matrix.vmTests }}
        run: |
          read -ra hosts <<< "$HOSTS"
          targets=()
          for host in "${hosts[@]}"; do
            targets+=(".#nixosConfigurations.$host.config.system.build.installTest")
          done
          nix build "${targets[@]}" --no-link --keep-going --print-build-logs --option post-build-hook ''
