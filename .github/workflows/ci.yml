name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required to scan pull requests
          GITLEAKS_LICENSE_KEY: "" # personal repo: no license needed
          GITLEAKS_ENABLE_COMMENTS: "false"

  zizmor:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          # Uploading SARIF needs security-events: write; fail in the log instead.
          advanced-security: false

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci
      - run: nix flake check --print-build-logs

  changed:
    name: Find changed hosts
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.changed.outputs.builds }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          hosts=$(nix run .#changed-hosts -- "$BASE")
          echo "changed hosts: $hosts"
          # All aarch64 hosts build in one job. Today those are the two Sparks,
          # which share their whole NVIDIA kernel, so it compiles once.
          builds=$(jq -c '
            map(select(.system != "aarch64-linux") | {name: .host, system, hosts: .host})
            + (map(select(.system == "aarch64-linux"))
               | if length > 0 then [{name: (map(.host) | join(", ")), system: "aarch64-linux", hosts: (map(.host) | join(" "))}] else [] end)
          ' <<< "$hosts")
          echo "builds=$builds" >> "$GITHUB_OUTPUT"

  # No secrets and no tailnet access.
  build:
    name: Build ${{ matrix.name }}
    needs: changed
    if: needs.changed.outputs.builds != '[]'
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # The NVIDIA kernel takes about 2h on the arm runner; a hung build stops here
    # instead of at GitHub's 6h limit.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed.outputs.builds) }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # --keep-going: one grouped host failing must not hide whether the others build.
      - name: Build closure
        env:
          HOSTS: ${{ matrix.hosts }}
        run: |
          read -ra hosts <<< "$HOSTS"
          targets=()
          for host in "${hosts[@]}"; do
            targets+=(".#nixosConfigurations.$host.config.system.build.toplevel")
          done
          nix build "${targets[@]}" --no-link --keep-going --print-build-logs
