name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to scan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # required to scan pull requests
          GITLEAKS_LICENSE_KEY: "" # personal repo: no license needed
          GITLEAKS_ENABLE_COMMENTS: "false"

  zizmor:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          persona: pedantic
          # Uploading SARIF needs security-events: write; fail in the log instead.
          advanced-security: false

  flake-check:
    name: Flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - run: nix fmt -- --ci
      - run: nix flake check --print-build-logs

  changed:
    name: Find changed hosts
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.changed.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          hosts=$(nix run .#changed-hosts -- "$BASE")
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "changed hosts: $hosts"

  # No secrets; the lab cache only through its public read-only route.
  build:
    name: Build ${{ matrix.host }}
    needs: changed
    if: needs.changed.outputs.hosts != '[]'
    runs-on: ${{ matrix.system == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changed.outputs.hosts) }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Reads what the hosts already built through the public read-only route
      # (services/attic-public.nix); skipped until the cache key is committed.
      - name: Build closure
        env:
          HOST: ${{ matrix.host }}
        run: |
          cache=$(nix eval --json ".#nixosConfigurations.$HOST.config.homelab.cache" \
            --apply 'c: { inherit (c) publicUrl publicKey; }')
          key=$(jq -r '.publicKey // empty' <<< "$cache")
          opts=()
          if [ -n "$key" ]; then
            opts=(--option extra-substituters "$(jq -r .publicUrl <<< "$cache")"
              --option extra-trusted-public-keys "$key"
              --option connect-timeout 5)
          fi
          nix build ".#nixosConfigurations.$HOST.config.system.build.toplevel" --no-link --print-build-logs "${opts[@]}"
