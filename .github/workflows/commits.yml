name: commits

# Its own workflow so that editing a PR title re-runs only this check.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: commits-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Commit format
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # list the PR's commits
    steps:
      # The PR title becomes the squash commit's subject on main.
      # Merge commits from "Update branch" never land, so they are skipped.
      - name: Check PR title and commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          COMMITS: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/commits
        run: |
          set -euo pipefail
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ]'
          subjects=$(gh api --paginate "$COMMITS" \
            --jq '.[] | select(.parents | length == 1) | "commit \(.sha[0:7]): \(.commit.message | split("\n")[0])"')
          bad=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if ! grep -Eq "$re" <<< "${line#*: }"; then
              echo "not a Conventional Commit: $line"
              bad=1
            fi
          done <<< "PR title: $TITLE"$'\n'"$subjects"
          if [ "$bad" = 1 ]; then
            echo "::error::Use <type>(<scope>): <summary>, type one of feat fix docs style refactor perf test build ci chore revert (AGENTS.md)."
            exit 1
          fi
